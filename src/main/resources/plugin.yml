name: DogArmor
# Filled in by processResources from build.gradle.kts, so the version is
# written in exactly one place.
version: '${version}'
main: dev.dogarmor.DogArmorPlugin
api-version: '26.3'
description: Upgradable dog armour - upgrade your dog's wolf armour through copper, iron, gold, diamond and netherite tiers.
commands:
  dogarmor:
    description: Dog armour commands.
    usage: /dogarmor [info|upgrade|remove|list|give <tier>|reload]
    aliases: [dog]
permissions:
  dogarmor.use:
    description: Allows checking, upgrading and removing dog armour.
    default: true
  dogarmor.admin:
    description: Allows /dogarmor give, /dogarmor reload and upgrading other players' dogs.
    default: op
